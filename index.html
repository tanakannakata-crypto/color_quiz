<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色彩検定・専門知識 演習クイズ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #2d3748;
    }

    .app-container {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #4a5568;
      color: #ffffff;
      padding: 20px 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .quiz-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #718096;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #3182ce;
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }

    .question-card h2 {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #1a202c;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      font-size: 1rem;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      color: #2d3748;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #3182ce;
      background-color: #ebf8ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: #38a169;
      background-color: #f0fff4;
      color: #22543d;
      font-weight: bold;
    }

    .option-btn.incorrect {
      border-color: #e53e3e;
      background-color: #fff5f5;
      color: #742a2a;
    }

    .feedback-box {
      border-radius: 10px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.correct {
      background-color: #f0fff4;
      border: 1px solid #c6f6d5;
      color: #22543d;
    }

    .feedback-box.incorrect {
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      color: #742a2a;
    }

    .feedback-title {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .feedback-detail {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .next-btn, .restart-btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
    }

    .next-btn:hover, .restart-btn:hover {
      background-color: #2b6cb0;
    }

    .result-screen {
      text-align: center;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #ebf8ff;
      border: 6px solid #3182ce;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .score-num {
      font-size: 2rem;
      font-weight: bold;
      color: #2b6cb0;
    }

    .score-percentage {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2c5282;
      margin-top: 4px;
    }

    .score-label {
      font-size: 0.75rem;
      color: #4a5568;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">

    </div>

    <div id="quiz-screen" class="quiz-body">

        <span id="score-display">正解数: 0</span>
      </div>

      <div class="progress-bar-bg">

      <div class="question-card">
        <h2 id="question-text">問題を読み込み中...</h2>
      </div>

      <div id="options-container" class="options-grid"></div>

      <div id="feedback-container" class="feedback-box">
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-detail" class="feedback-detail"></div>
      </div>

      <button id="next-btn" class="next-btn" style="display: none;">次の問題へ</button>
    </div>

    <div id="result-screen" class="quiz-body result-screen" style="display: none;">
      <h2>演習完了！</h2>
      <div class="score-circle">
        <div id="final-score" class="score-num">0 / 33</div>
        <div id="final-percentage" class="score-percentage">正答率: 0%</div>
        <div class="score-label">スコア結果</div>

      <button id="restart-btn" class="restart-btn">もう一度挑戦する</button>

  </div>

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const progressBarEl = document.getElementById('progress-bar');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackTitleEl = document.getElementById('feedback-title');
    const feedbackDetailEl = document.getElementById('feedback-detail');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreEl = document.getElementById('final-score');
    const finalPercentageEl = document.getElementById('final-percentage');
    const resultCommentEl = document.getElementById('result-comment');

    function initQuiz() {
      questionsList = shuffleArray(rawQuestions);
      currentIndex = 0;
      score = 0;
      
      quizScreen.style.display = 'flex';
      resultScreen.style.display = 'none';
      
      loadQuestion();
    }

    function loadQuestion() {
      let q = { ...questionsList[currentIndex] };
      
      if (q.isDynamicUnitQuiz) {
        const unitPairs = [
          { name: "光度", unit: "カンデラ（cd）" },
          { name: "照度", unit: "ルクス（lx）" },
          { name: "光束", unit: "ルーメン（lm）" },
          { name: "輝度", unit: "カンデラ毎平方メートル（cd/m²）" }
        ];
        const allUnitsPool = ["カンデラ（cd）", "ルクス（lx）", "ルーメン（lm）", "カンデラ毎平方メートル（cd/m²）", "ワット（W）"];
        
        const selectedTarget = unitPairs[Math.floor(Math.random() * unitPairs.length)];
        
        q.question = `以下のうち、「${selectedTarget.name}」の単位として正しいものはどれか？`;
        q.correct = selectedTarget.unit;
        
        const wrongUnits = allUnitsPool.filter(u => u !== selectedTarget.unit);
        q.dummies = shuffleArray(wrongUnits).slice(0, 3);
      }
      
      questionCountEl.textContent = `問題 ${currentIndex + 1} / ${questionsList.length}`;
      scoreDisplayEl.textContent = `正解数: ${score}`;
      progressBarEl.style.width = `${((currentIndex) / questionsList.length) * 100}%`;
      
      questionTextEl.textContent = q.question;
      
      optionsContainer.innerHTML = '';
      feedbackContainer.style.display = 'none';
      feedbackContainer.className = 'feedback-box';
      nextBtn.style.display = 'none';
      selectedOptionIndex = null;

      const shuffledDummies = shuffleArray(q.dummies).slice(0, 3);
      const allChoices = [q.correct, ...shuffledDummies];
      currentOptions = shuffleArray(allChoices);

      currentOptions.forEach((optionText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        const prefix = String.fromCharCode(65 + index);
        btn.textContent = `${prefix}. ${optionText}`;
        
        btn.addEventListener('click', () => selectOption(index, q));
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, currentQ) {
      if (selectedOptionIndex !== null) return;
      
      selectedOptionIndex = selectedIndex;
      const selectedText = currentOptions[selectedIndex];
      const isCorrect = (selectedText === currentQ.correct);

      const buttons = optionsContainer.children;
      
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (currentOptions[i] === currentQ.correct) {
          buttons[i].classList.add('correct');
        } else if (i === selectedIndex && !isCorrect) {
          buttons[i].classList.add('incorrect');
        }
      }

      if (isCorrect) {
        score++;
        scoreDisplayEl.textContent = `正解数: ${score}`;
        feedbackContainer.className = 'feedback-box correct';
        feedbackTitleEl.textContent = '⭕ 正解！';
      } else {
        feedbackContainer.className = 'feedback-box incorrect';
        feedbackTitleEl.textContent = `❌ 不正解... (正解: ${currentQ.correct})`;
      }

      feedbackDetailEl.textContent = currentQ.explanation;
      feedbackContainer.style.display = 'flex';
      nextBtn.style.display = 'block';
    }

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < questionsList.length) {
        loadQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      quizScreen.style.display = 'none';
      resultScreen.style.display = 'flex';
      
      const totalQuestions = questionsList.length;
      const percentage = Math.round((score / totalQuestions) * 100);
      
      finalScoreEl.textContent = `${score} / ${totalQuestions}`;
      finalPercentageEl.textContent = `正答率: ${percentage}%`;
      
      if (percentage === 100) {
        resultCommentEl.textContent = "完璧です！全問正解おめでとうございます！色彩検定の専門知識はバッチリです！";
      } else if (percentage >= 80) {
        resultCommentEl.textContent = "素晴らしい成績です！高得点達成です。惜しかった問題を復習して満点を目指しましょう！";
      } else if (percentage >= 50) {
        resultCommentEl.textContent = "合格ラインまであと一歩！間違えた箇所を中心にもう一度おさらいしてみましょう。";
      } else {
        resultCommentEl.textContent = "お疲れ様でした！繰り返しチャレンジして知識を確実に定着させていきましょう！";
      }
    }

    restartBtn.addEventListener('click', initQuiz);

    initQuiz();
  </script>
</body>
</html>
